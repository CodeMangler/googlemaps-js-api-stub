<!DOCTYPE html>
<html>
<head>
  <title>Google Maps Stub Test</title>
  <script src="stub.js"></script>
</head>
<body>
  <h1>Google Maps Stub Test</h1>
  <p>Open the console to see the test results.</p>

  <script>
    console.log('--- Testing Google Maps Stub v3.64.0 ---');

    // Test importLibrary
    console.log('Testing google.maps.importLibrary...');
    const libraries = ['maps', 'places', 'maps3d', 'routes', 'addressValidation', 'airQuality'];
    Promise.all(libraries.map(lib => google.maps.importLibrary(lib))).then(() => {
      console.log('All libraries imported successfully');
    });

    // Test AdvancedMarkerElement
    console.log('Testing google.maps.marker.AdvancedMarkerElement...');
    const marker = new google.maps.marker.AdvancedMarkerElement({
      title: 'Test Marker',
      position: { lat: 0, lng: 0 }
    });
    console.log('AdvancedMarkerElement:', marker);

    // Test new Place class
    console.log('Testing google.maps.places.Place...');
    const newPlace = new google.maps.places.Place({ id: 'test-place' });
    newPlace.fetchFields().then(response => {
        console.log('places.Place.fetchFields response:', response);
    });

    // Test Routes API
    console.log('Testing google.maps.routes.computeRoutes...');
    google.maps.routes.computeRoutes({}).then(response => {
        console.log('computeRoutes response:', response);
    });

    console.log('--- Test Setup Complete ---');
  </script>
</body>
</html>
